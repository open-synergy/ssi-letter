scenarios:
  - name: "Outgoing Letter - Full Workflow: draft to open to done"
    steps:
      - step: "Create letter type"
        action: "create"
        model: "letter_type"
        save_as: "letter_type"
        values:
          name: "Test Outgoing Letter Type"
          code: "TOLT"

      - step: "Get main partner"
        action: "search"
        model: "res.partner"
        domain: [["is_company", "=", true]]
        limit: 1
        save_as: "partner"

      - step: "Create outgoing letter"
        action: "create"
        model: "outgoing_letter"
        save_as: "letter"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['letter_type'].id"
          date: 2026-01-15
          title: "Test Outgoing Letter"
          partner_id: "EVAL: registry['partner'].id"
          internal_partner_id: "EVAL: registry['partner'].id"

      - step: "Assert created in draft"
        action: "assert"
        target: "letter"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm outgoing letter"
        action: "call"
        target: "letter"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "letter"
        method: "invalidate_cache"

      - step: "Approve outgoing letter"
        action: "call"
        target: "letter"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Invalidate cache after approve"
        action: "call"
        target: "letter"
        method: "invalidate_cache"

      - step: "Mark outgoing letter as done"
        action: "call"
        target: "letter"
        method: "action_done"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "done"

  - name: "Outgoing Letter - Restart from confirm state"
    steps:
      - step: "Create letter type"
        action: "create"
        model: "letter_type"
        save_as: "letter_type"
        values:
          name: "Test Outgoing Letter Type Restart"
          code: "TOLTR"

      - step: "Get main partner"
        action: "search"
        model: "res.partner"
        domain: [["is_company", "=", true]]
        limit: 1
        save_as: "partner"

      - step: "Create outgoing letter"
        action: "create"
        model: "outgoing_letter"
        save_as: "letter"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['letter_type'].id"
          date: 2026-01-15
          title: "Test Outgoing Letter Restart"
          partner_id: "EVAL: registry['partner'].id"
          internal_partner_id: "EVAL: registry['partner'].id"

      - step: "Confirm outgoing letter"
        action: "call"
        target: "letter"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "letter"
        method: "invalidate_cache"

      - step: "Restart outgoing letter"
        action: "call"
        target: "letter"
        method: "action_restart"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "draft"
